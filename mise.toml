[env]
# Environment variables for the project
CGO_ENABLED = "1"

[tools]
# Specify Go version
go = "1.26.1"

[tasks.build]
description = "Build all binaries"
run = "go build -o remoti ./cmd/remoti && go build -o remoti-mcp ./cmd/remoti-mcp"

[tasks."build:server"]
description = "Build the remoti input server"
run = "go build -o remoti ./cmd/remoti"

[tasks."build:mcp"]
description = "Build the MCP server for Claude Code"
run = "go build -o remoti-mcp ./cmd/remoti-mcp"

[tasks.run]
description = "Run the remoti input server (requires root for uinput)"
run = "sudo ./remoti"

[tasks."run:mcp"]
description = "Run the MCP server (connects to remoti input server)"
run = "./remoti-mcp"

[tasks.test]
description = "Run tests"
run = "go test ./..."

[tasks.tidy]
description = "Tidy Go modules"
run = "go mod tidy"

[tasks.clean]
description = "Clean build artifacts"
run = "rm -f remoti remoti-mcp"
